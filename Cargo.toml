[package]
name = "dns-jump"
version = "0.1.0"
edition = "2021"
description = "A minimal DNS switcher for Linux (NetworkManager) inspired by DNS Jumper"
license = "MIT"
authors = ["DNS Jump Contributors"]
readme = "README.md"
repository = "https://github.com/DnsJump/dns-jump"

[[bin]]
name = "dns-jump"
path = "src/main.rs"

[dependencies]
anyhow = "1"
directories = "5"
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio"] }
relm4 = { version = "0.9", features = ["libadwaita", "macros", "gnome_46"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

[package.metadata.aur]
depends = ["gtk4", "libadwaita", "networkmanager"]
optdepends = ["systemd: DNS cache flush via resolvectl"]
